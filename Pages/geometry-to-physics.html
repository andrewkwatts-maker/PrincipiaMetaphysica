<body>
    <div id="main-content">
    <main class="gp-page">
        <h1>Geometry to Physics</h1>
        <p class="gp-lead">The geometry exists by theorem. The steps marked failing below show where the physics
            is not yet reproduced. Every value, status and experiment on this page is read from the engine's
            artifacts; <span class="gp-open-word">OPEN</span> marks an input the engine could not supply.</p>
        <div id="gp-summary" class="gp-summary" aria-live="polite">Loading the walkthrough...</div>
        <nav id="gp-stages" class="gp-stagenav" aria-label="Stages"></nav>
        <div id="gp-steps"></div>
        <p id="gp-error" class="gp-error" role="alert" hidden></p>
        <noscript>
            <h2>Geometry to Physics (without JavaScript)</h2>
            <p>This page lists the steps from the closed G2 geometry to each physical quantity, with the value,
               status and experimental pull of each. It needs JavaScript to draw the cards. The same data is in
               <a href="../AutoGenerated/geometry_to_physics.json">geometry_to_physics.json</a>.
               The geometry exists by theorem; the failing steps show where physics is not yet reproduced.</p>
        </noscript>
    </main>
    </div>
